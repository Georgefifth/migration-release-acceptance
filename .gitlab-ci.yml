spec:
  inputs:
    migration_scenario:
      description: 'Trusted reference migration to accept'
      type: string
      default: expand
      options: [expand, breaking]
---
stages: [test, acceptance]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  image: python:3.12-slim
  timeout: 10m

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  MIGRATION_SCENARIO: '$[[ inputs.migration_scenario ]]'

unit:
  stage: test
  script:
    - python -m unittest discover -s tests -v

.postgres:
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: acceptance
    POSTGRES_USER: acceptance
    # Synthetic throwaway CI service credentials; never use a real DB secret here.
    POSTGRES_PASSWORD: ephemeral-fixture-only
    DATABASE_URL: postgresql://acceptance:ephemeral-fixture-only@postgres:5432/acceptance
    ACCEPTANCE_DISPOSABLE_DB: 'yes'
  before_script:
    - pip install -r requirements.txt
    - python -m acceptance.wait_db
  artifacts:
    when: always
    expire_in: 14 days
    paths: [reports/]

fixture-regressions:
  extends: .postgres
  stage: test
  script:
    # This job verifies expected failures; it is NOT a release approval.
    - python -m acceptance.demo

adapter-contract:
  extends: .postgres
  stage: test
  script:
    # Integration smoke tests, including partial-startup cleanup; not release approval.
    - python -m examples.verify_adapter

package-contract:
  extends: .postgres
  stage: test
  script:
    - python -m pip wheel --no-deps --wheel-dir dist .
    - python tools/verify_distribution.py
  artifacts:
    when: always
    expire_in: 14 days
    paths: [dist/, reports/]

upstream-fastapi:
  extends: .postgres
  image: python:3.14-slim
  stage: test
  before_script:
    - pip install uv==0.12.5
    - python -m integrations.prepare_fastapi
    - uv sync --project .upstream/source --package app --frozen --no-dev
    - .upstream/source/.venv/bin/python -m acceptance.wait_db
  script:
    # Fixed upstream revision + reviewed candidate change; integration self-test.
    - .upstream/source/.venv/bin/python -m acceptance.project --integration integrations.fastapi_case:integration --check
    - .upstream/source/.venv/bin/python -m integrations.fastapi_case --scenario breaking
    - .upstream/source/.venv/bin/python -m integrations.fastapi_case --scenario expand
    # Verify the same real API through the public project entry point.
    - .upstream/source/.venv/bin/python -m acceptance.project --integration integrations.fastapi_case:integration --candidate item-title-storage --output reports/upstream-project

release-acceptance:
  extends: .postgres
  stage: acceptance
  script:
    # A breaking candidate really fails this job (exit 1); errors exit 2.
    - python -m acceptance.runner --scenario "$MIGRATION_SCENARIO"
